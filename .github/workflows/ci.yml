name: CI ReMed

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: remed_test
          POSTGRES_USER: remed_ci
          POSTGRES_PASSWORD: remed_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remed_ci -d remed_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      POSTGRES_DB: remed_test
      POSTGRES_USER: remed_ci
      POSTGRES_PASSWORD: remed_ci_password
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint e formatação (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Verificação de vulnerabilidades (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Verificações do Django
        run: python manage.py check

      - name: Testes automatizados em PostgreSQL com cobertura
        run: |
          coverage run manage.py test --verbosity=2
          coverage report
