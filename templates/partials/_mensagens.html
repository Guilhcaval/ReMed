{% if messages %}
  <div class="remed-mensagens mb-3" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div
        class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.level_tag|default:'info' }}{% endif %} alert-dismissible fade show"
        role="{% if message.level_tag == 'error' or message.level_tag == 'warning' %}alert{% else %}status{% endif %}"
      >
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar aviso"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
