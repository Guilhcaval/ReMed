[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".venv",
    "docs",
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (segurança — ADR 0012)
    "DJ",  # flake8-django
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101", "S105", "S106"]
"**/tests.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["core", "nucleo", "contas", "auditoria", "notificacoes", "pontos_coleta", "medicamentos", "solicitacoes", "correspondencias"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "core/wsgi.py",
    "core/asgi.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
